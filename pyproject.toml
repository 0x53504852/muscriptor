[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muscriptor"
version = "0.1.0"
description = "Audio-to-MIDI transcription using a transformer language model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "numpy>=1.24",
    "einops>=0.4",
    "mido>=1.3",
    "safetensors>=0.4",
    "huggingface_hub>=0.13",
    "typer>=0.10",
]

[project.optional-dependencies]
xformers = ["xformers"]

[project.scripts]
muscriptor = "muscriptor.main:main"

[tool.hatch.build.targets.wheel]
packages = ["muscriptor"]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>muscriptor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>muscriptor</h1>
      <div id="status">Drop a WAV file anywhere to transcribe.</div>
    </header>

    <main>
      <section id="conditioning">
        <div id="conditioning-header">
          <h2>Conditioning instruments <span class="hint">(optional — leave empty for auto-detect)</span></h2>
          <div id="conditioning-actions">
            <button type="button" id="cond-none">Clear</button>
          </div>
        </div>
        <div id="conditioning-list"></div>
      </section>

      <div id="dropzone">
        <p>Drag &amp; drop a .wav file here</p>
        <input id="file-input" type="file" accept="audio/wav,.wav" hidden />
        <button id="file-button">…or pick a file</button>
      </div>

      <div id="controls" hidden>
        <button id="play">Play</button>
        <button id="stop">Stop</button>
        <button id="follow" hidden>Follow playhead</button>
        <span id="clock">0.0s</span>
        <label id="mix-label">
          <span class="mix-end">WAV</span>
          <input id="mix" type="range" min="0" max="1" step="0.01" value="0.5" />
          <span class="mix-end">MIDI</span>
        </label>
      </div>

      <section id="piano-roll-wrap">
        <canvas id="piano-roll" width="1200" height="400"></canvas>
      </section>

      <aside id="instruments">
        <h2>Instruments</h2>
        <ul id="instrument-list"></ul>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
